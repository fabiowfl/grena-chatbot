name: Keep Agrismart Awake

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Installa Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visita app e risveglia se necessario
        run: |
          cat > wake.py << 'PYEOF'
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto("https://grena-chatbot.streamlit.app/", timeout=60000)

              try:
                  wake_button = page.get_by_text("Yes, get this app back up!")
                  wake_button.wait_for(state="visible", timeout=8000)
                  wake_button.click()
                  print("App era in sleep: risveglio avviato, attesa caricamento completo...")
                  page.wait_for_timeout(60000)
              except PlaywrightTimeoutError:
                  print("App gia sveglia, nessuna azione necessaria.")

              page.wait_for_timeout(8000)
              browser.close()
          PYEOF
          python wake.py
